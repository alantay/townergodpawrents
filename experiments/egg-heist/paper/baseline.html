<script>
'use strict';
const paintedSheet = document.getElementById('paint-sheet').getAttribute('href');
document.querySelectorAll('image[data-sheet]').forEach(image => image.setAttribute('href', paintedSheet));
// Feel knobs. Widths are FULL widths, and time is elapsed milliseconds.
const TARGET_UNITS = 20;
const SWEEP_MS = 1100;
const SWEET_WIDTH = 0.14;
const PERFECT_WIDTH = 0.05;
const SHIFT = 0.08;
const CENTRE_MIN = 0.47;
const CENTRE_MAX = 0.85;
const INITIAL_CENTRE = 0.7;
const MAX_TILT_DEG = 20;
const JUMP_MS = 760;
const REDUCED_JUMP_MS = 160;
const RELEASE_HOLD_MS = 600;
const BUBBLE_MS = 1200;
const INTRO_MS = 2000;
const REDUCED_INTRO_MS = 700;
const TRAY_FALL_MS = 700;
const EAT_MS = 1100;
const DOOR_OPEN_MS = 650;
const INNOCENT_PAUSE_MS = 550;
const REDUCED_BEAT_MS = 180;
const TRAY_START_Y = 57;
const TRAY_DRAG_DISTANCE = 9;
const CAMERA_START = Date.UTC(2025, 8, 29, 11, 28, 49);
const CAMERA_RETURN = Date.UTC(2025, 8, 29, 18, 42, 7);

function triangle(elapsedMs) {
  const phase = ((Math.max(0, elapsedMs) % (SWEEP_MS * 2)) / SWEEP_MS);
  return phase <= 1 ? phase : 2 - phase;
}
function classify(power, centre) {
  // Epsilon makes mathematically equal decimal band edges inclusive.
  const epsilon = 1e-10;
  if (power < centre - SWEET_WIDTH / 2 - epsilon) return 'miss';
  if (power > centre + SWEET_WIDTH / 2 + epsilon) return 'strong';
  return Math.abs(power - centre) <= PERFECT_WIDTH / 2 + epsilon ? 'perfect' : 'hook';
}
function progressAfter(units, outcome) {
  return Math.min(TARGET_UNITS, Math.max(0, units + ({miss:0, hook:2, perfect:3, strong:-2}[outcome])));
}
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const mix = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const trayY = units => 33;
const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
const ui = Object.fromEntries(['game','light','door','mess','dog','tray','paw1','paw2','timestamp','bubble','intro','card','ending','replay','hud','hint','count','fill','band','perfect','needle','release','status'].map(id => [id, document.getElementById(id)]));
const state = {};
const LINES = {
  miss:['Again.', 'Still here.', 'A little higher.', 'Nobody saw that.'],
  hook:['Nearly mine.', 'That moved.', 'Good. Again.', 'Coming along.'],
  strong:["That was the counter's fault.", 'Too much enthusiasm.', 'A minor setback.', 'I meant to do that.'],
  win:['Worth it.', 'Lunch, then.', 'All accounted for.', 'I was here the whole time.']
};
function think(category, now) {
  const choices = LINES[category];
  const previous = state.previousLines[category];
  const available = choices.map((_, index) => index).filter(index => index !== previous);
  const index = available[Math.floor(Math.random() * available.length)];
  state.previousLines[category] = index;
  state.bubble = choices[index];
  state.bubbleUntil = now + BUBBLE_MS;
}

function reset(now = performance.now()) {
  Object.assign(state, {
    phase:'intro', phaseStart:now, units:0, fromUnits:0, toUnits:0,
    attempts:0, hooks:0, perfects:0, overshoots:0, startedAt:0,
    centre:INITIAL_CENTRE, nextCentre:INITIAL_CENTRE, owner:null,
    chargeStart:0, power:0, releasePower:0, releaseCentre:INITIAL_CENTRE,
    releaseUntil:0, outcome:null, tilt:0, fromTilt:0, toTilt:0,
    jumpDuration:JUMP_MS, reduced:motionPreference.matches,
    bubble:'', bubbleUntil:0, previousLines:{}, cameraStart:Date.now(),
    returnAt:0, winLogged:false, endingStage:'', winBeats:null,
    introDuration:motionPreference.matches ? REDUCED_INTRO_MS : INTRO_MS

  ui.status.textContent = 'Hold and release to jump.';
  render(now);
}
function stats(now, reason = 'jump') {
  console.log('[The Egg Heist: ' + reason + ']', {
    attempts:state.attempts, hooks:state.hooks, perfects:state.perfects,
    overshoots:state.overshoots, elapsed_s:Number(((now - state.startedAt) / 1000).toFixed(1))
  });
}
function clearOwner() {
  const owner = state.owner;
  state.owner = null;
  if (owner && owner.type === 'pointer' && ui.game.hasPointerCapture(owner.id)) ui.game.releasePointerCapture(owner.id);
}
function beginCharge(owner, now) {
  if (state.phase !== 'idle' && state.phase !== 'result') return;
  state.phase = 'charging';
  state.owner = owner;
  state.chargeStart = now;

function formatTime(ms) { return new Date(ms).toISOString().slice(0,19).replace('T',' '); }

  ui.intro.hidden = state.phase !== 'intro';
