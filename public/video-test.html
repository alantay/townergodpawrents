<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video test</title>
<style>body{font:15px system-ui;margin:16px}video{width:30%;background:#ccc;margin:4px}pre{white-space:pre-wrap;font-size:13px}</style>
<p>Pick a video. Wait 10 seconds, tap each grey box once, then screenshot this page.</p>
<input type="file" accept="video/*">
<div id="v"></div>
<pre id="o"></pre>
<script>
const o = document.getElementById("o");
const log = (s) => (o.textContent += s + "\n");
document.querySelector("input").onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  o.textContent = "";
  log(`file: type=${JSON.stringify(f.type)} size=${(f.size / 1e6).toFixed(1)}MB`);
  log(navigator.userAgent.replace(/.*(iPhone OS [\d_]+).*/, "$1"));
  const url = URL.createObjectURL(f);
  const cases = [
    ["A plain", url, (v) => {}],
    ["B #t", url + "#t=0.001", (v) => { v.preload = "metadata"; }],
    ["C #t+load", url + "#t=0.001", (v) => { v.preload = "metadata"; v.load(); }],
    ["D controls", url + "#t=0.001", (v) => { v.preload = "metadata"; v.controls = true; }],
    ["E seek", url, (v) => { v.preload = "metadata"; v.addEventListener("loadedmetadata", () => (v.currentTime = 0.001), { once: true }); }],
  ];
  const box = document.getElementById("v");
  box.replaceChildren();
  for (const [name, src, setup] of cases) {
    const v = document.createElement("video");
    v.muted = true;
    v.playsInline = true;
    v.src = src;
    setup(v);
    box.append(v);
    v.onloadedmetadata = () => log(`${name}: metadata ${v.videoWidth}x${v.videoHeight}`);
    v.onloadeddata = () => log(`${name}: frame ready`);
    v.onerror = () => log(`${name}: error ${v.error && v.error.code} ${v.error && v.error.message}`);
    v.onplaying = () => log(`${name}: playing`);
    if (name !== "D controls") v.onclick = () => {
      log(`${name}: tapped`);
      v.muted = false;
      v.play().catch((err) => log(`${name}: play failed ${err.name} ${err.message}`));
    };
    setTimeout(() => log(`${name}: after 8s readyState=${v.readyState} networkState=${v.networkState}`), 8000);
  }
};
</script>
