name: Admin video

on:
  repository_dispatch:
    types: [admin-video]

permissions:
  contents: write

concurrency:
  group: admin-video
  cancel-in-progress: false
  queue: max

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu's mirror can crawl (10+ min on 19 Nov), so keep ffmpeg's .debs
      # in the Actions cache. A stale or missing cache falls back to apt and
      # saves a fresh copy. Unused caches expire after 7 days.
      - uses: actions/cache/restore@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ffmpeg-${{ runner.os }}-
      - id: ffmpeg
        run: |
          if ls ~/ffmpeg-debs/*.deb >/dev/null 2>&1 && sudo apt-get install -y --no-download ~/ffmpeg-debs/*.deb; then
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y ffmpeg
          rm -rf ~/ffmpeg-debs && mkdir -p ~/ffmpeg-debs && cp /var/cache/apt/archives/*.deb ~/ffmpeg-debs/
          echo "fresh=true" >> "$GITHUB_OUTPUT"
      - if: steps.ffmpeg.outputs.fresh == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-${{ runner.os }}-${{ github.run_id }}
      - run: node --experimental-strip-types scripts/admin-video.ts
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      - name: Delete uploads after posting
        if: success()
        run: |
          node --experimental-strip-types --input-type=module -e '
            import { del } from "@vercel/blob";
            import { isUploadUrl } from "./src/lib/admin/validate.ts";
            const urls = JSON.parse(process.env.PAYLOAD).media.map((m) => m.url);
            if (!urls.every(isUploadUrl)) throw new Error("Bad upload URL");
            await del(urls);
          '
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
